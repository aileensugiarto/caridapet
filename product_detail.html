<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YeeeHaul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/x-icon" href="images/Jessie.jpg" style="border-radius: 100px;">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> All Products
    </a>
    <div class="container">

        <!-- SAME PROFILE SECTION -->
        <div class="profile-section">
            <img src="images/Jessie.jpg" alt="Profile Picture" class="profile-pic">

            <h1 class="logo-text"><span style="color: #ff1900;">Yeee</span>Haul</h1>

            <p class="description">
                The best online finds, curated just for you. <br>
                Shop them on Amazon & Shopee. 🛒
            </p>

            <div class="socials">
                <a href="https://www.youtube.com/@wumbobee" target="_blank" class="social-btn">
                    <i class="fa-brands fa-youtube" style="color: red;"></i> YouTube
                </a>
                <a href="https://www.tiktok.com/@caridapet" target="_blank" class="social-btn">
                    <i class="fa-brands fa-tiktok"></i> TikTok
                </a>
                <a href="https://www.instagram.com/yeeehaul" target="_blank" class="social-btn">
                    <i class="fa-brands fa-instagram" style="color: #E1306C;"></i> Instagram
                </a>
                <a href="https://www.facebook.com/profile.php?id=61591306735268" target="_blank" class="social-btn">
                    <i class="fa-brands fa-facebook" style="color: #1877F2;"></i> Facebook
                </a>
            </div>
        </div>

        <div class="product-detail">

            <div class="product-img-container">
                <img id="productImage" class="product-detail-image" src="" alt="">
            </div>

            <div style="display:flex; flex-direction:column; align-items:center; gap:8px; width:100%;">
                <h2 class="product-detail-name" id="productName"></h2>
                <p class="product-detail-desc" id="productDescription"></p>
            </div>

            <div class="buy-buttons">
                <!-- Amazon BUTTON -->
                <a id="amazonBtn" class="buy-btn" target="_blank">
                    <div class="buy-btn-icon">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Amazon_logo.svg/960px-Amazon_logo.svg.png"
                            alt="Amazon">
                    </div>
                    <div class="buy-btn-text">
                        <span class="buy-btn-title">Amazon</span>
                        <span class="buy-btn-subtitle">Shop product on Amazon</span>
                    </div>
                    <i class="fa-solid fa-arrow-right buy-btn-arrow"></i>
                </a>

                <!-- Shopee BUTTON -->
                <a id="shopeeBtn" class="buy-btn" target="_blank">
                    <div class="buy-btn-icon">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
                    </div>
                    <div class="buy-btn-text">
                        <span class="buy-btn-title">Shopee</span>
                        <span class="buy-btn-subtitle">Shop product on Shopee</span>
                    </div>
                    <i class="fa-solid fa-arrow-right buy-btn-arrow"></i>
                </a>
            </div>

        </div>

    </div>



    <footer class="footer">
        <div class="footer-main">
            <div class="footer-logo">
                <img src="images/Jessie.jpg" alt="CariDapet">
                <span class="footer-logo-name"><span>Yeee</span>Haul</span>
            </div>
            <div class="footer-socials">
                <a href="https://www.youtube.com/@wumbobee" target="_blank" class="footer-social-btn"><i
                        class="fa-brands fa-youtube" style="color: red;"></i></a>
                <a href="https://www.tiktok.com/@caridapet" target="_blank" class="footer-social-btn"><i
                        class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.instagram.com/yeeehaul" target="_blank" class="footer-social-btn"><i
                        class="fa-brands fa-instagram" style="color: #E1306C;"></i></a>
                <a href="https://www.facebook.com/profile.php?id=61591306735268" target="_blank"
                    class="footer-social-btn"><i class="fa-brands fa-facebook" style="color: #1877F2;"></i></a>
            </div>
        </div>
        <hr class="footer-divider">
        <p class="footer-copy">Copyright © 2026 YeeeHaul. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/product_detail.js"></script>

</body>

</html>
