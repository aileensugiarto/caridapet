<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product</title>

    <link rel="stylesheet" href="css/platforms.css">
</head>

<body>

<div class="container">

    <!-- SAME PROFILE SECTION -->
    <div class="profile-section">
        <img src="images/Jessie.jpg" class="profile-pic">

        <h1 class="logo-text">
            <span style="color:#ff1900;">Yeee</span>Haul
        </h1>

        <p class="description">
            Welcome to YeeeHaul's Collection.<br>
            The wild west of online finds. 🤠
        </p>
    </div>

    <div class="product-detail">

        <img id="productImage">

        <h2 id="productName"></h2>

        <p id="productDescription"></p>

        <div class="buy-buttons">

            <a id="amazonBtn" target="_blank">
                Buy on Amazon
            </a>

            <a id="shopeeBtn" target="_blank">
                Buy on Shopee
            </a>

        </div>

    </div>

</div>

<script src="js/products.js"></script>
<script src="js/product_detail.js"></script>

</body>

</html>
